name: build-linux-packages

# Builds the AppImage + .deb on an ubuntu-22.04
# runner. Triggered on workflow_dispatch and on tag
# pushes (v*) so a tagged release gets the artifacts.
# The artifacts are uploaded as workflow artifacts;
# publish them to a release on GitHub Releases
# manually after verifying.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  packages:
    # 24.04, not 22.04. The cs-pw-helper helper needs libportal 0.7
    # (xdp_session_open_pipewire_remote and the gtk3 portal variant)
    # and libpipewire-0.3-dev; jammy ships libportal 0.4, which lacks
    # them, and libportal-gtk3-dev is not packaged there at all.
    # 24.04 is also the stack the helper is validated against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install build dependencies
        # appimagetool pulls in mksquashfs + libfuse2.
        # desktop-file-validate + appstreamcli are needed
        # by appimagetool's AppStream validation step.
        # dpkg-deb builds the .deb. mpv is a runtime
        # dep (the .deb Depends: it) but we also need
        # it for the AppImage's "is this binary going
        # to work on a real system" sanity check.
        #
        # The rest build cs-pw-helper, the Wayland screen
        # capture helper. build.sh runs it unconditionally
        # (override with CAPTURESPIKE_SKIP_HELPER=1), so
        # without these the package build fails by design
        # rather than shipping an app that cannot record.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libfuse2 \
              squashfs-tools \
              desktop-file-utils \
              appstream-util \
              mpv \
              dpkg-dev \
              build-essential \
              pkg-config \
              libpipewire-0.3-dev \
              libportal-dev \
              libportal-gtk3-dev \
              libgtk-3-dev

      - name: Build packages
        # build.sh fetches appimagetool (cached), the
        # bundled ffmpeg (cached), and produces
        # dist/CaptureSpike-x86_64.AppImage +
        # dist/CaptureSpike-Setup-<version>.deb +
        # matching .sha256 files.
        run: |
          bash installer/linux/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CaptureSpike-Linux
          path: |
            dist/CaptureSpike-x86_64.AppImage
            dist/CaptureSpike-x86_64.AppImage.sha256
            dist/CaptureSpike-Setup-*.deb
            dist/CaptureSpike-Setup-*.deb.sha256
          if-no-files-found: error
          retention-days: 14
